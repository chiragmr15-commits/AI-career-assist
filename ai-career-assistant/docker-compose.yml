# Docker Compose Configuration

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: ai_career_db
    environment:
      POSTGRES_DB: ai_career_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_career_backend
    environment:
      DEBUG: "False"
      SECRET_KEY: "your-secret-key"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/ai_career_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Frontend - React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_career_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: ai_career_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
